
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kirehe Health Centers Data Management</title>

  <style>
    :root {
      --navy:#12335b;
      --blue:#1769aa;
      --teal:#087f8c;
      --bg:#f3f6fb;
      --white:#fff;
      --text:#1c2b3a;
      --muted:#6b7b8d;
      --border:#dce5ee;
      --red:#c0392b;
      --green:#17834a;
    }

    * { box-sizing:border-box; }
    body {
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    button,input,select,textarea { font:inherit; }
    button { cursor:pointer; }
    .hidden { display:none!important; }

    .login-page {
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      background:linear-gradient(135deg,#12335b,#087f8c);
    }
    .login-card {
      width:100%;
      max-width:430px;
      background:white;
      padding:30px;
      border-radius:20px;
      box-shadow:0 20px 55px #00152d45;
    }
    .logo {
      width:64px;height:64px;
      margin:0 auto 14px;
      display:grid;place-items:center;
      border-radius:18px;
      background:#e1f3f4;
      font-size:32px;
    }
    h1,h2,h3,p { margin-top:0; }
    .login-card h1 { text-align:center;font-size:22px;line-height:1.4; }
    .subtitle { text-align:center;color:var(--muted);font-size:13px; }
    label { display:block;font-size:13px;font-weight:bold;margin:14px 0 6px; }
    input,select,textarea {
      width:100%;padding:12px;
      border:1px solid var(--border);
      border-radius:9px;background:white;color:var(--text);
      outline:none;
    }
    input:focus,select:focus,textarea:focus {
      border-color:var(--blue);
      box-shadow:0 0 0 3px #1769aa17;
    }
    textarea { min-height:100px;resize:vertical; }
    .btn {
      border:0;border-radius:9px;padding:11px 15px;
      font-weight:bold;background:var(--blue);color:white;
    }
    .btn:hover { filter:brightness(.94); }
    .btn.full { width:100%;margin-top:18px;padding:13px; }
    .btn.secondary { background:#e9eff6;color:var(--navy); }
    .btn.danger { background:var(--red); }
    .btn.green { background:var(--green); }
    .btn.small { padding:7px 10px;font-size:12px; }
    .note { color:var(--muted);font-size:12px;line-height:1.6; }
    .error { color:var(--red);font-size:13px;margin-top:12px;white-space:pre-wrap; }
    .success { color:var(--green);font-size:13px;margin-top:12px; }

    .topbar {
      background:var(--navy);color:white;padding:14px 22px;
      display:flex;align-items:center;justify-content:space-between;gap:12px;
    }
    .brand { font-weight:bold;font-size:16px;line-height:1.4; }
    .brand small { display:block;font-size:11px;color:#d0dfed;font-weight:normal; }
    .user-area { display:flex;align-items:center;gap:10px; }
    .user-name { font-size:12px;text-align:right;line-height:1.5; }
    .shell { display:flex;min-height:calc(100vh - 65px); }
    .sidebar {
      width:235px;background:white;border-right:1px solid var(--border);
      padding:16px 12px;flex-shrink:0;
    }
    .nav-btn {
      display:block;width:100%;text-align:left;padding:12px;
      margin:4px 0;border:0;border-radius:8px;background:white;
      color:var(--text);font-weight:bold;
    }
    .nav-btn:hover,.nav-btn.active { background:#e8f1fb;color:var(--blue); }
    .main { flex:1;min-width:0;padding:25px; }
    .page-head {
      display:flex;justify-content:space-between;align-items:center;
      gap:12px;flex-wrap:wrap;margin-bottom:20px;
    }
    .page-head h2 { margin:0;font-size:23px; }
    .cards {
      display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
      gap:14px;margin-bottom:22px;
    }
    .stat {
      padding:18px;background:white;border:1px solid var(--border);
      border-radius:13px;
    }
    .stat .label { color:var(--muted);font-size:12px; }
    .stat .number { font-size:27px;font-weight:bold;margin-top:9px; }
    .panel {
      background:white;border:1px solid var(--border);
      border-radius:13px;padding:20px;margin-bottom:18px;
    }
    .panel h3 { font-size:16px;margin-bottom:16px; }
    .grid2 { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px; }
    .table-wrap { width:100%;overflow:auto; }
    table { width:100%;border-collapse:collapse;font-size:13px; }
    th,td { padding:11px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top; }
    th { background:#f5f8fc;color:#43576b;white-space:nowrap; }
    .badge {
      display:inline-block;border-radius:30px;padding:4px 8px;
      background:#e4f5eb;color:#13733f;font-size:11px;font-weight:bold;
    }
    .badge.inactive { background:#fde9e7;color:#a32c22; }
    .muted { color:var(--muted);font-size:12px; }
    .toolbar { display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px; }
    .empty { padding:24px;text-align:center;color:var(--muted); }
    .message-item { border-bottom:1px solid var(--border);padding:13px 0; }
    .message-item:last-child { border-bottom:0; }
    .message-meta { color:var(--muted);font-size:12px;margin-bottom:7px; }
    .loading { padding:20px;text-align:center;color:var(--muted); }

    @media(max-width:950px) {
      .cards { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .sidebar { width:190px; }
      .main { padding:16px; }
    }
    @media(max-width:650px) {
      .shell { display:block; }
      .sidebar {
        width:100%;display:flex;overflow:auto;gap:4px;
        border-right:0;border-bottom:1px solid var(--border);
        padding:8px;
      }
      .nav-btn { width:auto;white-space:nowrap;margin:0;padding:10px; }
      .topbar { padding:12px;align-items:flex-start; }
      .brand { font-size:13px; }
      .user-name { max-width:115px;overflow-wrap:anywhere; }
      .main { padding:12px; }
      .cards { gap:8px; }
      .stat { padding:12px; }
      .stat .number { font-size:22px; }
      .grid2 { grid-template-columns:1fr; }
      .login-card { padding:22px; }
    }
  </style>
</head>

<body>
  <!-- LOGIN -->
  <section id="loginPage" class="login-page">
    <div class="login-card">
      <div class="logo">🏥</div>
      <h1>KIREHE HEALTH CENTERS<br>DATA MANAGEMENT SYSTEM</h1>
      <p class="subtitle">Secure Health Information Management</p>

      <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" autocomplete="username" required placeholder="Enter username">

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password"
               required placeholder="Enter password">

        <label for="role">Login as</label>
        <select id="role" required>
          <option value="ADMIN">ADMIN</option>
          <option value="DATA MANAGER">DATA MANAGER</option>
          <option value="VIEWER">VIEWER</option>
        </select>

        <button id="loginButton" class="btn full" type="submit">Sign In</button>
        <div id="loginError" class="error"></div>
      </form>

      <p class="note" style="margin-top:18px">
        Access is restricted to authorized users. Contact your system
        administrator if your account is inactive or you cannot sign in.
      </p>
      <div id="setupNotice" class="note"></div>
    </div>
  </section>

  <!-- APPLICATION -->
  <section id="appPage" class="hidden">
    <header class="topbar">
      <div class="brand">
        🏥 KIREHE HEALTH CENTERS
        <small>DATA MANAGEMENT SYSTEM</small>
      </div>
      <div class="user-area">
        <div class="user-name" id="userSummary"></div>
        <button class="btn secondary small" onclick="signOut()">Logout</button>
      </div>
    </header>

    <div class="shell">
      <aside class="sidebar">
        <button class="nav-btn active" data-page="dashboard" onclick="openPage('dashboard',this)">📊 Dashboard</button>
        <button class="nav-btn" data-page="records" onclick="openPage('records',this)">📋 Health Records</button>
        <button class="nav-btn" data-page="centers" onclick="openPage('centers',this)">🏥 Health Centers</button>
        <button class="nav-btn" data-page="users" onclick="openPage('users',this)">👥 Users</button>
        <button class="nav-btn" data-page="messages" onclick="openPage('messages',this)">✉ Messages</button>
        <button class="nav-btn" data-page="audit" onclick="openPage('audit',this)">🛡 Audit Log</button>
      </aside>

      <main class="main">
        <div id="content"><div class="loading">Loading system...</div></div>
      </main>
    </div>
  </section>

<script>
  let TOKEN = "";
  let CURRENT_USER = null;
  let CENTERS = [];
  let USERS = [];

  const $ = id => document.getElementById(id);
  const esc = value => String(value == null ? "" : value).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);

  function callServer(method, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(error => reject(
          new Error(error && error.message ? error.message : String(error))
        ))[method](...args);
    });
  }

  function showError(container, error) {
    const el = $(container);
    if (el) el.textContent = error.message || String(error);
  }

  async function init() {
    try {
      const config = await callServer("getLoginConfig");
      if (config.needsFirstAdmin) {
        $("setupNotice").textContent =
          "System has no active administrator yet. The owner must run setupSystem() and createFirstAdminNow() in Apps Script.";
      }
    } catch (e) {
      $("setupNotice").textContent =
        "Cannot connect to the system. Check the Apps Script deployment and spreadsheet permissions.";
    }
  }

  $("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault();
    $("loginError").textContent = "";
    $("loginButton").disabled = true;
    $("loginButton").textContent = "Signing in...";

    try {
      const username = $("username").value.trim();
      const password = $("password").value;
      const role = $("role").value;

      const result = await callServer("login", username, password, role);
      if (!result || !result.success || !result.token) {
        throw new Error("Login ntiyagenze neza.");
      }

      TOKEN = result.token;
      CURRENT_USER = result.user;
      sessionStorage.setItem("kireheSessionToken", TOKEN);

      $("loginPage").classList.add("hidden");
      $("appPage").classList.remove("hidden");
      $("userSummary").innerHTML =
        "<strong>" + esc(CURRENT_USER.fullName) + "</strong><br>" +
        esc(CURRENT_USER.role) + " · " + esc(CURRENT_USER.healthCenter);

      applyRoleMenu();
      await openPage("dashboard");
    } catch (error) {
      showError("loginError", error);
    } finally {
      $("loginButton").disabled = false;
      $("loginButton").textContent = "Sign In";
    }
  });

  function applyRoleMenu() {
    document.querySelectorAll('[data-page="users"],[data-page="centers"],[data-page="audit"]')
      .forEach(button => {
        button.classList.toggle("hidden", CURRENT_USER.role !== "ADMIN");
      });
  }

  async function signOut() {
    try {
      if (TOKEN) await callServer("logout", TOKEN);
    } catch (e) {
      console.warn(e);
    }
    TOKEN = "";
    CURRENT_USER = null;
    sessionStorage.removeItem("kireheSessionToken");
    $("appPage").classList.add("hidden");
    $("loginPage").classList.remove("hidden");
    $("password").value = "";
    $("loginError").textContent = "";
  }

  async function openPage(page, button) {
    if (!TOKEN || !CURRENT_USER) return;

    if (button) {
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      button.classList.add("active");
    } else {
      const b = document.querySelector('[data-page="' + page + '"]');
      if (b) {
        document.querySelectorAll(".nav-btn").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
      }
    }

    $("content").innerHTML = '<div class="loading">Loading...</div>';

    try {
      if (page === "dashboard") return await renderDashboard();
      if (page === "records") return await renderRecords();
      if (page === "centers") return await renderCenters();
      if (page === "users") return await renderUsers();
      if (page === "messages") return await renderMessages();
      if (page === "audit") return await renderAudit();
    } catch (error) {
      $("content").innerHTML =
        '<div class="panel"><h3>Unable to load page</h3><p class="error">' +
        esc(error.message) + '</p><button class="btn" onclick="openPage(\'' +
        esc(page) + '\')">Retry</button></div>';
    }
  }

  function pageHead(title, subtitle) {
    return '<div class="page-head"><div><h2>' + esc(title) +
      '</h2><p class="muted">' + esc(subtitle || "") + '</p></div></div>';
  }

  async function renderDashboard() {
    const d = await callServer("getDashboard", TOKEN);
    $("content").innerHTML = pageHead("Dashboard", "System overview") +
      '<div class="cards">' +
      statCard("Health Centers", d.totalCenters) +
      statCard("Health Records", d.totalHealthRecords) +
      statCard("Messages", d.totalMessages) +
      (CURRENT_USER.role === "ADMIN" ? statCard("Active Users", d.totalUsers) : "") +
      '</div><div class="panel"><h3>Recent Health Records</h3>' +
      recordsTable(d.recentRecords || []) + '</div>';
  }

  function statCard(label, value) {
    return '<div class="stat"><div class="label">' + esc(label) +
      '</div><div class="number">' + esc(value == null ? 0 : value) + '</div></div>';
  }

  function recordsTable(records) {
    if (!records.length) return '<div class="empty">No health records found.</div>';
    return '<div class="table-wrap"><table><thead><tr>' +
      '<th>Date</th><th>Category</th><th>Health Center</th><th>Description</th><th>Created By</th>' +
      '</tr></thead><tbody>' + records.map(r =>
        '<tr><td>' + esc(r.recordDate) + '</td><td>' + esc(r.category) +
        '</td><td>' + esc(r.healthCenter) + '</td><td>' + esc(r.description) +
        '</td><td>' + esc(r.createdBy) + '</td></tr>'
      ).join("") + '</tbody></table></div>';
  }

  async function renderRecords() {
    const records = await callServer("listHealthRecords", TOKEN);
    const canWrite = ["ADMIN","DATA MANAGER"].includes(CURRENT_USER.role);

    let form = "";
    if (canWrite) {
      CENTERS = await callServer("listCenters", TOKEN);
      form = '<div class="panel"><h3>Add Health Record</h3>' +
        '<form id="recordForm"><div class="grid2">' +
        '<div><label>Category</label><select name="category" required>' +
        '<option value="">Select category</option>' +
        ['HMIS','OPD','Maternity','Immunization','HIV','Malaria','Family Planning','Nutrition','Other']
          .map(x => '<option>' + esc(x) + '</option>').join("") +
        '</select></div><div><label>Record Date</label><input type="date" name="recordDate" required></div>' +
        (CURRENT_USER.role === "ADMIN" ?
          '<div><label>Health Center</label><select name="healthCenter" required>' +
          '<option value="">Select center</option>' +
          CENTERS.filter(c => c.Status === "ACTIVE").map(c =>
            '<option value="' + esc(c.CenterName) + '">' + esc(c.CenterName) + '</option>'
          ).join("") + '</select></div>' : '') +
        '</div><label>Description / Data Summary</label><textarea name="description" required maxlength="10000"></textarea>' +
        '<button class="btn" type="submit">Save Record</button><span id="recordMsg" class="success"></span></form></div>';
    }

    $("content").innerHTML = pageHead("Health Records", "Submit and review health information") +
      form + '<div class="panel"><h3>Records History</h3>' +
      recordsTable(records) + '</div>';

    if (canWrite) $("recordForm").addEventListener("submit", saveRecordForm);
  }

  async function saveRecordForm(e) {
    e.preventDefault();
    const form = new FormData(e.target);
    const data = Object.fromEntries(form.entries());
    try {
      const result = await callServer("saveHealthRecord", TOKEN, data);
      $("recordMsg").textContent = result.message;
      e.target.reset();
      await renderRecords();
    } catch (error) {
      $("recordMsg").textContent = error.message;
      $("recordMsg").className = "error";
    }
  }

  async function renderCenters() {
    if (CURRENT_USER.role !== "ADMIN") throw new Error("Admin only.");
    CENTERS = await callServer("listCenters", TOKEN);

    $("content").innerHTML = pageHead("Health Centers", "Manage health facilities") +
      '<div class="panel"><h3>Add Health Center</h3>' +
      '<form id="centerForm"><div class="grid2">' +
      '<div><label>Center Name</label><input name="CenterName" required></div>' +
      '<div><label>District</label><input name="District" value="Kirehe" required></div>' +
      '<div><label>Sector</label><input name="Sector"></div>' +
      '</div><button class="btn" type="submit">Save Health Center</button>' +
      '<span id="centerMsg" class="success"></span></form></div>' +
      '<div class="panel"><h3>Registered Centers</h3>' + centersTable(CENTERS) + '</div>';

    $("centerForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      try {
        const r = await callServer("saveCenter", TOKEN, data);
        $("centerMsg").textContent = r.message;
        await renderCenters();
      } catch (error) {
        $("centerMsg").textContent = error.message;
        $("centerMsg").className = "error";
      }
    });
  }

  function centersTable(items) {
    if (!items.length) return '<div class="empty">No health centers registered.</div>';
    return '<div class="table-wrap"><table><thead><tr><th>Center ID</th><th>Name</th><th>District</th><th>Sector</th><th>Status</th></tr></thead><tbody>' +
      items.map(c => '<tr><td>' + esc(c.CenterID) + '</td><td>' + esc(c.CenterName) +
      '</td><td>' + esc(c.District) + '</td><td>' + esc(c.Sector) +
      '</td><td>' + esc(c.Status) + '</td></tr>').join("") +
      '</tbody></table></div>';
  }

  async function renderUsers() {
    if (CURRENT_USER.role !== "ADMIN") throw new Error("Admin only.");
    CENTERS = await callServer("listCenters", TOKEN);
    USERS = await callServer("listUsers", TOKEN);

    $("content").innerHTML = pageHead("User Management", "Create accounts and assign roles") +
      '<div class="panel"><h3>Create User</h3>' +
      '<form id="userForm"><div class="grid2">' +
      '<div><label>Full Name</label><input name="fullName" required></div>' +
      '<div><label>Username</label><input name="username" required></div>' +
      '<div><label>Password (minimum 10 characters)</label><input name="password" type="password" minlength="10" required></div>' +
      '<div><label>Email</label><input name="email" type="email"></div>' +
      '<div><label>Role</label><select name="role" id="newUserRole" required>' +
      '<option value="DATA MANAGER">DATA MANAGER</option><option value="VIEWER">VIEWER</option><option value="ADMIN">ADMIN</option></select></div>' +
      '<div id="centerField"><label>Health Center</label><select name="healthCenter" id="newUserCenter">' +
      '<option value="">Select center</option>' + CENTERS.filter(c => c.Status === "ACTIVE").map(c =>
      '<option value="' + esc(c.CenterName) + '">' + esc(c.CenterName) + '</option>').join("") +
      '</select></div>' +
      '</div><button class="btn" type="submit">Create User</button><span id="userMsg" class="success"></span></form></div>' +
      '<div class="panel"><h3>Existing Users</h3>' + usersTable(USERS) + '</div>';

    $("newUserRole").addEventListener("change", function() {
      $("centerField").classList.toggle("hidden", this.value === "ADMIN");
    });

    $("userForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      try {
        const r = await callServer("saveUser", TOKEN, data);
        $("userMsg").textContent = r.message;
        await renderUsers();
      } catch (error) {
        $("userMsg").textContent = error.message;
        $("userMsg").className = "error";
      }
    });
  }

  function usersTable(users) {
    if (!users.length) return '<div class="empty">No users found.</div>';
    return '<div class="table-wrap"><table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Health Center</th><th>Email</th><th>Status</th></tr></thead><tbody>' +
      users.map(u => '<tr><td>' + esc(u.fullName) + '</td><td>' + esc(u.username) +
      '</td><td>' + esc(u.role) + '</td><td>' + esc(u.healthCenter) +
      '</td><td>' + esc(u.email) + '</td><td>' + esc(u.status) + '</td></tr>').join("") +
      '</tbody></table></div>';
  }

  async function renderMessages() {
    const [messages, recipients] = await Promise.all([
      callServer("listMessages", TOKEN),
      callServer("listMessageRecipients", TOKEN)
    ]);

    $("content").innerHTML = pageHead("Messages", "Communicate with authorized system users") +
      '<div class="panel"><h3>Send Message</h3><form id="messageForm">' +
      '<label>Recipient</label><select name="recipient" required>' +
      '<option value="">Select recipient</option>' +
      recipients.map(r => '<option value="' + esc(r.username) + '">' +
      esc(r.fullName) + ' (' + esc(r.username) + ' · ' + esc(r.role) + ')</option>').join("") +
      (CURRENT_USER.role === "ADMIN" ? '<option value="ALL">ALL USERS</option>' : '') +
      '</select><label>Message</label><textarea name="message" maxlength="5000" required></textarea>' +
      '<button class="btn" type="submit">Send Message</button><span id="messageMsg" class="success"></span></form></div>' +
      '<div class="panel"><h3>Messages History</h3>' +
      (messages.length ? messages.map(m => '<div class="message-item"><div class="message-meta">' +
      esc(m.createdAt) + ' · ' + esc(m.sender) + ' → ' + esc(m.recipient) +
      '</div><div>' + esc(m.message) + '</div></div>').join("") :
      '<div class="empty">No messages yet.</div>') + '</div>';

    $("messageForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      try {
        const r = await callServer("sendMessage", TOKEN, data);
        $("messageMsg").textContent = r.message;
        await renderMessages();
      } catch (error) {
        $("messageMsg").textContent = error.message;
        $("messageMsg").className = "error";
      }
    });
  }

  async function renderAudit() {
    if (CURRENT_USER.role !== "ADMIN") throw new Error("Admin only.");
    const logs = await callServer("getAuditLog", TOKEN);
    $("content").innerHTML = pageHead("Audit Log", "Recent system activity") +
      '<div class="panel"><div class="table-wrap"><table><thead><tr>' +
      '<th>Time</th><th>Username</th><th>Role</th><th>Action</th><th>Details</th><th>Status</th>' +
      '</tr></thead><tbody>' + (logs.length ? logs.map(a =>
      '<tr><td>' + esc(a.timestamp) + '</td><td>' + esc(a.username) +
      '</td><td>' + esc(a.role) + '</td><td>' + esc(a.action) +
      '</td><td>' + esc(a.details) + '</td><td>' + esc(a.status) + '</td></tr>'
      ).join("") : '<tr><td colspan="6">No audit records.</td></tr>') +
      '</tbody></table></div></div>';
  }

  init();
</script>
</body>
</html>
