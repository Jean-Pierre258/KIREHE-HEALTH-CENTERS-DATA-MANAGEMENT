<!DOCTYPE html>
<html><head><base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kirehe Admin Console</title>
<style>
:root{--navy:#12335b;--blue:#1769aa;--teal:#087f8c;--bg:#f3f6fb;--text:#1c2b3a;--muted:#6b7b8d;--border:#dce5ee;--red:#c0392b;--green:#17834a}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.top{background:var(--navy);color:white;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px}.top small{display:block;color:#d0dfed;margin-top:4px}.btn{border:0;border-radius:8px;padding:10px 13px;background:var(--blue);color:white;font-weight:bold}.secondary{background:#e9eff6;color:var(--navy)}.danger{background:var(--red)}.login{max-width:430px;margin:8vh auto;background:white;border:1px solid var(--border);border-radius:16px;padding:28px}.layout{display:flex;min-height:calc(100vh - 65px)}aside{width:220px;padding:12px;background:white;border-right:1px solid var(--border)}.nav{display:block;width:100%;text-align:left;border:0;border-radius:8px;background:white;padding:12px;margin:3px 0;font-weight:bold}.nav.active,.nav:hover{background:#e8f1fb;color:var(--blue)}main{padding:22px;flex:1;min-width:0}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}h2{margin:0 0 5px}h3{font-size:16px;margin:0 0 14px}.muted{color:var(--muted);font-size:12px}.panel{background:white;border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}label{display:block;font-size:13px;font-weight:bold;margin:12px 0 6px}input,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat{background:white;border:1px solid var(--border);border-radius:12px;padding:16px}.stat small{color:var(--muted)}.num{font-size:26px;font-weight:bold;margin-top:7px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}th{background:#f5f8fc;white-space:nowrap}.error{color:var(--red);white-space:pre-wrap;font-size:13px}.success{color:var(--green);font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.empty{padding:18px;text-align:center;color:var(--muted)}@media(max-width:800px){.layout{display:block}aside{width:100%;display:flex;overflow:auto}.nav{white-space:nowrap;width:auto}main{padding:12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}}
</style></head><body>
<header class="top"><div><strong>🏥 KIREHE HEALTH CENTERS — ADMIN CONSOLE</strong><small>Authorized administration only</small></div><div><button class="btn secondary" onclick="goMain()">Main System</button> <button class="btn danger" onclick="signOut()">Logout</button></div></header>
<section id="loginPage" class="login"><h2>Admin Sign In</h2><p class="muted">Use an active ADMIN account.</p><form id="loginForm"><label>Username</label><input id="username" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><input type="hidden" id="role" value="ADMIN"><button class="btn" style="width:100%;margin-top:16px">Sign In</button><p id="loginError" class="error"></p><p id="setupNotice" class="muted"></p></form></section>
<section id="appPage" class="hidden"><div class="layout"><aside><button class="nav active" data-page="dashboard" onclick="openPage('dashboard')">📊 Overview</button><button class="nav" data-page="centers" onclick="openPage('centers')">🏥 Health Centers</button><button class="nav" data-page="users" onclick="openPage('users')">👥 User Accounts</button><button class="nav" data-page="records" onclick="openPage('records')">📋 All Records</button><button class="nav" data-page="audit" onclick="openPage('audit')">🛡 Audit Log</button><button class="nav" data-page="password" onclick="openPage('password')">🔐 Change Password</button></aside><main id="content"><div class="panel">Loading...</div></main></div></section>
<script>
let TOKEN="",ME=null,CENTERS=[];
const $=id=>document.getElementById(id),esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function callServer(method,...args){return new Promise((resolve,reject)=>{if(typeof google==="undefined"||!google.script||!google.script.run){reject(new Error("Fungura Apps Script Web App URL irangiza na /exec?page=admin."));return;}const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e&&e.message?e.message:String(e))));if(typeof runner[method]!=="function"){reject(new Error("Server function ntibonetse: "+method));return;}runner[method](...args);});}
async function init(){if(typeof google==="undefined"||!google.script||!google.script.run){$("setupNotice").textContent="Fungura URL ya Apps Script irangiza na /exec?page=admin.";return;}try{const c=await callServer("getLoginConfig");if(c.needsFirstAdmin)$("setupNotice").textContent="Banza ukoreshe setupSystem() na createFirstAdminNow() muri Apps Script.";else $("setupNotice").textContent="Backend ihujwe."; }catch(e){$("setupNotice").textContent=e.message;}}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginError").textContent="";try{const r=await callServer("login",$("username").value.trim(),$("password").value,"ADMIN");TOKEN=r.token;ME=r.user;if(ME.role!=="ADMIN")throw new Error("Iyi page yemera ADMIN gusa.");$("loginPage").classList.add("hidden");$("appPage").classList.remove("hidden");await openPage("dashboard");}catch(err){$("loginError").textContent=err.message;}});
async function signOut(){try{if(TOKEN)await callServer("logout",TOKEN);}catch(e){}TOKEN="";ME=null;$("appPage").classList.add("hidden");$("loginPage").classList.remove("hidden");$("password").value="";}
function goMain(){window.top.location.href=window.location.href.split("?")[0];}
function pageHead(t,s){return '<div class="head"><div><h2>'+esc(t)+'</h2><div class="muted">'+esc(s||"")+'</div></div></div>';}
async function openPage(page){if(!TOKEN||!ME||ME.role!=="ADMIN")return;document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page===page));$("content").innerHTML='<div class="panel">Loading...</div>';try{if(page==="dashboard")await dashboard();else if(page==="centers")await centers();else if(page==="users")await users();else if(page==="records")await records();else if(page==="audit")await audit();else if(page==="password")passwordPage();}catch(e){$("content").innerHTML='<div class="panel"><h3>Could not load</h3><p class="error">'+esc(e.message)+'</p><button class="btn" onclick="openPage(\''+page+'\')">Retry</button></div>';}}
async function dashboard(){const d=await callServer("getDashboard",TOKEN);$("content").innerHTML=pageHead("Admin Overview","All health centers and system activity")+'<div class="stats"><div class="stat"><small>Active centers</small><div class="num">'+d.totalCenters+'</div></div><div class="stat"><small>Active users</small><div class="num">'+d.totalUsers+'</div></div><div class="stat"><small>Health records</small><div class="num">'+d.totalHealthRecords+'</div></div><div class="stat"><small>Messages</small><div class="num">'+d.totalMessages+'</div></div></div><div class="panel"><h3>Quick Actions</h3><div class="toolbar"><button class="btn" onclick="openPage(\'centers\')">Manage Centers</button><button class="btn" onclick="openPage(\'users\')">Manage Users</button><button class="btn" onclick="openPage(\'records\')">Review Records</button><button class="btn secondary" onclick="openPage(\'audit\')">View Audit Log</button></div></div>';}
async function centers(){CENTERS=await callServer("listCenters",TOKEN);$("content").innerHTML=pageHead("Health Centers","Register and update facilities")+'<div class="panel"><h3>Add / Edit Health Center</h3><form id="centerForm"><input type="hidden" name="CenterID"><div class="grid"><div><label>Center Name</label><input name="CenterName" required></div><div><label>District</label><input name="District" value="Kirehe" required></div><div><label>Sector</label><input name="Sector"></div><div><label>Status</label><select name="Status"><option>ACTIVE</option><option>INACTIVE</option></select></div></div><div class="toolbar" style="margin-top:14px"><button class="btn">Save Center</button><button type="button" class="btn secondary" onclick="document.getElementById(\'centerForm\').reset()">Clear</button><span id="result" class="success"></span></div></form></div><div class="panel"><h3>Registered Centers</h3><div class="tablewrap"><table><thead><tr><th>Name</th><th>District</th><th>Sector</th><th>Status</th><th>Action</th></tr></thead><tbody>'+ (CENTERS.length?CENTERS.map((c,i)=>'<tr><td>'+esc(c.CenterName)+'</td><td>'+esc(c.District)+'</td><td>'+esc(c.Sector)+'</td><td>'+esc(c.Status)+'</td><td><button class="btn secondary" onclick="editCenter('+i+')">Edit</button></td></tr>').join(""):'<tr><td colspan="5">No centers yet.</td></tr>')+'</tbody></table></div></div>';$("centerForm").addEventListener("submit",async e=>{e.preventDefault();try{const r=await callServer("saveCenter",TOKEN,Object.fromEntries(new FormData(e.target).entries()));$("result").textContent=r.message;await centers();}catch(err){$("result").textContent=err.message;}});}
function editCenter(i){const c=CENTERS[i],f=$("centerForm");Object.keys(c).forEach(k=>{if(f.elements[k])f.elements[k].value=c[k];});window.scrollTo(0,0);}
async function users(){CENTERS=await callServer("listCenters",TOKEN);const us=await callServer("listUsers",TOKEN);$("content").innerHTML=pageHead("User Accounts","Create accounts, assign roles, reset passwords, or deactivate access")+'<div class="panel"><h3>Create / Update User</h3><form id="userForm"><input type="hidden" name="userID"><div class="grid"><div><label>Full Name</label><input name="fullName" required></div><div><label>Username</label><input name="username" required></div><div><label>Password (10+ characters; leave blank on update to keep current)</label><input name="password" type="password" minlength="10"></div><div><label>Email</label><input name="email" type="email"></div><div><label>Role</label><select name="role" id="roleSelect"><option>DATA MANAGER</option><option>VIEWER</option><option>ADMIN</option></select></div><div id="centerWrap"><label>Health Center</label><select name="healthCenter"><option value="">Select center</option>'+CENTERS.filter(c=>c.Status==="ACTIVE").map(c=>'<option value="'+esc(c.CenterName)+'">'+esc(c.CenterName)+'</option>').join("")+'</select></div><div><label>Status</label><select name="status"><option>ACTIVE</option><option>INACTIVE</option></select></div></div><div class="toolbar" style="margin-top:14px"><button class="btn">Save User</button><button type="button" class="btn secondary" onclick="document.getElementById(\'userForm\').reset()">Clear</button><span id="result" class="success"></span></div></form></div><div class="panel"><h3>Existing Users</h3><div class="tablewrap"><table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Center</th><th>Email</th><th>Status</th><th>Action</th></tr></thead><tbody>'+us.map((u,i)=>'<tr><td>'+esc(u.fullName)+'</td><td>'+esc(u.username)+'</td><td>'+esc(u.role)+'</td><td>'+esc(u.healthCenter)+'</td><td>'+esc(u.email)+'</td><td>'+esc(u.status)+'</td><td><button class="btn secondary" onclick="editUser('+i+')">Edit</button></td></tr>').join("")+'</tbody></table></div></div>';$("roleSelect").addEventListener("change",()=> $("centerWrap").classList.toggle("hidden",$("roleSelect").value==="ADMIN"));$("userForm").addEventListener("submit",async e=>{e.preventDefault();try{const r=await callServer("saveUser",TOKEN,Object.fromEntries(new FormData(e.target).entries()));$("result").textContent=r.message;await users();}catch(err){$("result").textContent=err.message;}});window._users=us;}
function editUser(i){const u=window._users[i],f=$("userForm");Object.keys(u).forEach(k=>{if(f.elements[k])f.elements[k].value=u[k];});f.elements.password.value="";$("centerWrap").classList.toggle("hidden",u.role==="ADMIN");window.scrollTo(0,0);}
async function records(){const rs=await callServer("listHealthRecords",TOKEN);$("content").innerHTML=pageHead("All Health Records","Facility-level data across all centers")+'<div class="panel"><div class="toolbar"><button class="btn secondary" onclick="downloadCSV()">Export visible records to CSV</button></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Center</th><th>Category</th><th>Description</th><th>Created By</th></tr></thead><tbody>'+ (rs.length?rs.map(r=>'<tr><td>'+esc(r.recordDate)+'</td><td>'+esc(r.healthCenter)+'</td><td>'+esc(r.category)+'</td><td>'+esc(r.description)+'</td><td>'+esc(r.createdBy)+'</td></tr>').join(""):'<tr><td colspan="5">No records.</td></tr>')+'</tbody></table></div></div>';window._records=rs;}
function downloadCSV(){const rs=window._records||[];const cols=["recordDate","healthCenter","category","description","createdBy"];const csv=[cols.join(","),...rs.map(r=>cols.map(k=>'"'+String(r[k]||"").replace(/"/g,'""')+'"').join(","))].join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"}));a.download="kirehe-health-records.csv";a.click();URL.revokeObjectURL(a.href);}
async function audit(){const logs=await callServer("getAuditLog",TOKEN);$("content").innerHTML=pageHead("Audit Log","Latest 500 system activity events")+'<div class="panel"><div class="tablewrap"><table><thead><tr><th>Time</th><th>User</th><th>Role</th><th>Action</th><th>Details</th><th>Status</th></tr></thead><tbody>'+logs.map(a=>'<tr><td>'+esc(a.timestamp)+'</td><td>'+esc(a.username)+'</td><td>'+esc(a.role)+'</td><td>'+esc(a.action)+'</td><td>'+esc(a.details)+'</td><td>'+esc(a.status)+'</td></tr>').join("")+'</tbody></table></div></div>';}
function passwordPage(){$("content").innerHTML=pageHead("Change Password","Choose a strong password of at least 10 characters")+'<div class="panel"><form id="pwForm"><label>Current password</label><input type="password" name="oldPassword" required><label>New password</label><input type="password" name="newPassword" minlength="10" required><label>Confirm new password</label><input type="password" id="confirm" minlength="10" required><button class="btn" style="margin-top:14px">Change Password</button><p id="result" class="success"></p></form></div>';$("pwForm").addEventListener("submit",async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());if(d.newPassword!==$("confirm").value){$("result").textContent="Passwords ntizihuye.";return;}try{const r=await callServer("changeMyPassword",TOKEN,d.oldPassword,d.newPassword);$("result").textContent=r.message;e.target.reset();}catch(err){$("result").textContent=err.message;}});}
init();
</script></body></html>
